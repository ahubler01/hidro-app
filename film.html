<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Hidro · the film</title>
<link rel="icon" href="data:,">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Outfit:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<style>
:root{--petrol:#004656;--mint:#90FFBB;--lime:#E0FF48;--blue:#0478B2}
*{box-sizing:border-box;margin:0;padding:0}
html,body{height:100%;overflow:hidden;background:#fff;font-family:Outfit,"Century Gothic",Helvetica,Arial,sans-serif;-webkit-font-smoothing:antialiased;color:var(--petrol)}
svg{display:block}.hidro{overflow:visible}
#fit{position:absolute;left:0;top:0;width:1920px;height:1080px;transform-origin:0 0;overflow:hidden;background:#fff}
.layer{position:absolute;inset:0}
#bgColor{background:linear-gradient(135deg,#90FFBB 0%,#38DCD6 38%,#4BB3E7 70%,#0478B2 100%);opacity:0}
#shop{opacity:0;background:#EAF3F6}
#tv{position:absolute;left:0;top:0;width:1920px;height:1080px;transform-origin:0 0;border-radius:40px;box-shadow:0 0 0 26px #0A1A20,0 40px 90px rgba(0,40,50,.45);overflow:hidden;background:#004656}
#tv iframe,#ph iframe{border:0;display:block}
#ph{position:absolute;left:0;top:0;width:418px;height:872px;transform-origin:50% 50%;border-radius:70px;background:#06161B;box-shadow:0 40px 90px rgba(0,40,50,.28),0 0 0 3px #2B3F46 inset}
#ph .in{position:absolute;left:14px;top:14px;width:390px;height:844px;border-radius:56px;overflow:hidden;background:#fff}
#cap{position:absolute;left:150px;top:0;height:1080px;width:560px;display:flex;align-items:center;font-size:92px;font-weight:700;letter-spacing:-.03em;line-height:1.02;opacity:0}
#tap{position:absolute;width:96px;height:96px;margin:-48px 0 0 -48px;border-radius:50%;background:rgba(0,70,86,.22);border:5px solid rgba(0,70,86,.55);opacity:0}
#flyer{position:absolute;left:0;top:0;width:320px;height:249px;opacity:0;pointer-events:none}
.tr{position:absolute;border-radius:50%}
</style>
</head>
<body>
<div id="fit">
  <div class="layer" id="bgColor"></div>
  <div class="layer" id="shop"><svg viewBox="0 0 1920 1080" width="1920" height="1080">
    <defs><linearGradient id="slat" x1="0" y1="0" x2="1" y2="0"><stop offset="0" stop-color="#7FE0A6"/><stop offset=".35" stop-color="#2FA7C9"/><stop offset=".6" stop-color="#0478B2"/><stop offset="1" stop-color="#7FD36A"/></linearGradient></defs>
    <rect width="1920" height="1080" fill="#EEF4F6"/><rect width="1920" height="170" fill="#17252B"/><path d="M-100 170 Q960 300 2020 170 V120 H-100Z" fill="#0B5FA8"/>
    <rect x="0" y="860" width="1920" height="220" fill="#D8E2E5"/>
    <g id="shelves"></g>
    <rect x="310" y="826" width="1300" height="40" rx="20" fill="#fff"/><path d="M340 866 H1580 V1080 H340Z" fill="url(#slat)"/><g id="slats" stroke="#fff" stroke-opacity=".28" stroke-width="5"></g>
    <rect x="560" y="0" width="16" height="130" fill="#0A1A20"/><rect x="1344" y="0" width="16" height="130" fill="#0A1A20"/></svg></div>
  <div id="tv"><iframe id="fTv" src="station.html?film=1" width="1920" height="1080"></iframe></div>
  <div id="ph"><div class="in"><iframe id="fPh" src="index.html?embed=1&screen=launcher" width="390" height="844"></iframe></div></div>
  <div id="cap"></div>
  <div id="tap"></div>
  <div id="flyer"></div>
</div>
<script src="js/hidro.js"></script>
<script>
(function () {
  const H = HIDRO, $ = q => document.querySelector(q);
  const fit = () => { const s = Math.min(innerWidth / 1920, innerHeight / 1080); $('#fit').style.transform = `translate(${(innerWidth - 1920 * s) / 2}px,${(innerHeight - 1080 * s) / 2}px) scale(${s})`; };
  addEventListener('resize', fit); fit();
  $('#slats').innerHTML = Array.from({ length: 62 }, (_, i) => `<line x1="${350 + i * 20}" y1="870" x2="${350 + i * 20}" y2="1080"/>`).join('');
  $('#shelves').innerHTML = [60, 1640].map(x => `<g><rect x="${x}" y="420" width="220" height="440" rx="14" fill="#fff"/>` + [0, 1, 2, 3].map(r => Array.from({ length: 6 }, (_, i) => `<rect x="${x + 16 + i * 32}" y="${446 + r * 102}" width="26" height="${56 + (i * 7 + r * 5) % 18}" rx="6" fill="${['#8FD6FF', '#90FFBB', '#FFCFB5', '#F3BDFF', '#E0FF48', '#38DCD6'][(i + r) % 6]}"/>`).join('') + `<rect x="${x}" y="${522 + r * 102}" width="220" height="8" fill="#D3DFE3"/>`).join('') + '</g>').join('');
  window.__events = [];
  const mark = n => window.__events.push([performance.now() / 1000, n]);
  const wait = ms => new Promise(r => setTimeout(r, ms));
  const EASE = 'cubic-bezier(.45,.05,.2,1)', OUT = 'cubic-bezier(.2,.9,.25,1)';
  const P = $('#ph'), TV = $('#tv'), CAP = $('#cap'), phone = () => $('#fPh').contentWindow, tv = () => $('#fTv').contentWindow;
  /* phone pose: centre x, centre y, scale, rotation */
  let pose = null;
  const pT = (x, y, s, r = 0) => `translate(${x - 209}px,${y - 436}px) rotate(${r}deg) scale(${s})`;
  function phoneTo(x, y, s, r, ms, ease = EASE) { const a = P.animate([{ transform: pose }, { transform: pT(x, y, s, r) }], { duration: ms, easing: ease, fill: 'forwards' }); pose = pT(x, y, s, r); return a.finished; }
  const tT = (x, y, s) => `translate(${x - 960 * s}px,${y - 540 * s}px) scale(${s})`;
  let tpose = tT(960, 470, .58);
  function tvTo(x, y, s, ms, ease = EASE) { const a = TV.animate([{ transform: tpose }, { transform: tT(x, y, s) }], { duration: ms, easing: ease, fill: 'forwards' }); tpose = tT(x, y, s); return a.finished; }
  const fade = (el, from, to, ms, o = {}) => el.animate([{ opacity: from, ...(o.f || {}) }, { opacity: to, ...(o.t || {}) }], { duration: ms, easing: o.e || 'ease-out', fill: 'forwards' }).finished;
  async function caption(t, col) { if (CAP.textContent) { await fade(CAP, 1, 0, 160); } CAP.innerHTML = t; if (col) CAP.style.color = col; if (t) fade(CAP, 0, 1, 380, { f: { transform: 'translateX(-30px)' }, t: { transform: 'none' }, e: OUT }); }
  function tap(x, y) { const T = $('#tap'); T.style.left = x + 'px'; T.style.top = y + 'px'; return T.animate([{ opacity: 0, transform: 'scale(1.7)' }, { opacity: 1, transform: 'scale(1)', offset: .45 }, { opacity: 1, transform: 'scale(.78)', offset: .62 }, { opacity: 0, transform: 'scale(1.35)' }], { duration: 620, easing: 'ease-in-out' }).finished; }
  const PX = 1180, PY = 540, PS = 1.16;

  function reset() {
    pose = pT(PX, 1640, PS, 0); P.style.transform = pose; P.getAnimations().forEach(a => a.cancel());
    tpose = tT(960, 470, .58); TV.style.transform = tpose; TV.style.opacity = 0; TV.getAnimations().forEach(a => a.cancel());
    CAP.innerHTML = ''; CAP.style.color = '#004656';
  }
  async function play() {
    reset(); window.__events.length = 0; const t0 = performance.now();
    const A = phone().APP, at = async s => { const d = s * 1000 - (performance.now() - t0); if (d > 0) await wait(d); };
    phoneTo(PX, PY, PS, 0, 900, OUT);
    await at(.55); caption('Open<br>gow.');
    /* 1 · tap the icon, the app opens on the code */
    await at(1.15); const g = phone().document.querySelector('#gowIcon i').getBoundingClientRect();
    tap(PX + (g.left + g.width / 2 - 195) * PS, PY + (g.top + g.height / 2 - 422) * PS);
    await at(1.5); A.launchApp('qr');
    await at(2.75); caption('Show<br>the code.');
    await at(3.35); A.scan(); await at(4.15); mark('beep');
    /* 2 · pay exactly as today */
    await at(4.85); A.payOpen(); caption('Pay<br>as always.');
    await at(6.2); A.payDone(); mark('pay');
    await at(7.35); A.payClose(); caption('Hidro does<br>the rest.', '#004656');
    /* 3 · Hidro: sound, spin, back on his feet */
    await at(7.75); fade($('#bgColor'), 0, 1, 900); CAP.style.color = '#004656';
    const before = A.earn(undefined, { sound: false }).before; mark('hidro');
    await at(11.6); caption('');
    /* 4 · he jumps to the big screen, the phone gets small */
    await at(11.9); fade($('#shop'), 0, 1, 700); TV.animate([{ opacity: 0, transform: tT(960, 330, .5) }, { opacity: 1, transform: tpose }], { duration: 800, easing: OUT, fill: 'forwards' });
    phoneTo(285, 800, .56, -7, 900);
    await at(12.75); fly();
    await at(13.55); tv().STATION.enter({}); phoneTo(150, 1420, .5, -10, 800); tvTo(960, 540, 1, 1150);
    TV.animate([{ borderRadius: '40px' }, { borderRadius: '0px' }], { duration: 1150, easing: EASE, fill: 'forwards' });
    /* 5 · the Plaza, full screen */
    await at(18.6); TV.animate([{ borderRadius: '0px' }, { borderRadius: '40px' }], { duration: 900, easing: EASE, fill: 'forwards' }); tvTo(960, 470, .58, 1000);
    A.show('earn', true);
    await at(19.5); phoneTo(PX, PY, PS, 0, 1000, OUT); fade($('#shop'), 1, 0, 800); tvTo(PX, PY, .12, 760); await at(19.95); fade(TV, 1, 0, 200);
    await at(20.0); A.totals(before);
    /* 6 · what is yours, on your phone only */
    await at(20.5); caption('Yours.<br>Only yours.');
    await at(22.9); H.hop(phone().document.querySelector('#homeHidro'), { h: 26 });
    await at(25.2); mark('end');
  }
  function fly() {
    const F = $('#flyer'); F.innerHTML = H.svg({ shine: 92, level: 5, head: 'crown', mood: 'joy', stars: false });
    const a = [285, 690], c = [420, 90], b = [960, 250];
    H.run(760, t => {
      const u = t / .76, e = u < .5 ? 2 * u * u : 1 - Math.pow(-2 * u + 2, 2) / 2;
      const x = (1 - e) * (1 - e) * a[0] + 2 * (1 - e) * e * c[0] + e * e * b[0], y = (1 - e) * (1 - e) * a[1] + 2 * (1 - e) * e * c[1] + e * e * b[1];
      const s = .42 + .5 * Math.sin(Math.PI * e) * .9 - .12 * e;
      F.style.opacity = u > .9 ? (1 - u) / .1 : Math.min(1, u * 6);
      F.style.transform = `translate(${x - 160}px,${y - 125}px) scale(${s})`; H.applyPose(F, { rot: e * 360, mood: 'joy', vel: .5 * Math.sin(Math.PI * e) });
    }, () => { F.style.opacity = 0; });
  }
  reset();
  window.FILM = { play, reset };
  const q = new URLSearchParams(location.search);
  if (!q.has('film')) addEventListener('load', () => setTimeout(play, 600));
})();
</script>
</body>
</html>
