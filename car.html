<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Hidro in the car</title>
<link rel="icon" href="data:,">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Outfit:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<style>
:root{--petrol:#004656;--mint:#90FFBB;--lime:#E0FF48;--blue:#0478B2}
*{box-sizing:border-box;margin:0;padding:0}
html,body{height:100%;overflow:hidden;background:#0A1216;font-family:Outfit,"Century Gothic",Helvetica,Arial,sans-serif;-webkit-font-smoothing:antialiased;color:#fff}
svg{display:block}.hidro{overflow:visible}
#fit{position:absolute;left:0;top:0;width:1920px;height:1080px;transform-origin:0 0;overflow:hidden;background:linear-gradient(180deg,#C9E4EF 0,#EAF5F9 190px,#1B262B 190px,#12191D 100%)}
.dash{position:absolute;inset:0}
.disp{position:absolute;left:250px;top:104px;width:1420px;height:792px;border-radius:56px;background:#050A0C;padding:22px;box-shadow:0 30px 80px rgba(0,0,0,.5)}
.ui{position:relative;width:100%;height:100%;border-radius:38px;overflow:hidden;background:#0E1A20;display:flex}
.dock{width:116px;background:#0A1419;display:flex;flex-direction:column;align-items:center;padding:26px 0;gap:22px;flex-shrink:0}
.dock b{font-size:27px;font-weight:600}
.dock i{width:72px;height:72px;border-radius:18px;display:grid;place-items:center}
.dock i svg{width:42px}
.map{flex:1;position:relative;overflow:hidden;background:#18262C}
.map svg{position:absolute;inset:0;width:100%;height:100%}
.eta{position:absolute;right:24px;bottom:24px;background:rgba(10,20,25,.92);border-radius:28px;padding:18px 26px;font-size:25px;font-weight:600;line-height:1.2}
.eta span{display:block;font-size:20px;font-weight:500;color:#9FB9C2;margin-top:2px}
.col{width:486px;flex-shrink:0;padding:20px;display:flex;flex-direction:column;gap:18px;background:#0E1A20}
.w{border-radius:38px;position:relative;overflow:hidden}
#hw{height:532px;background:#90FFBB;color:var(--petrol);padding:24px 28px}
#hw .hd{display:flex;justify-content:space-between;align-items:center;font-size:29px;font-weight:800}
#hw .wk{font-size:23px;font-weight:700;background:rgba(0,70,86,.1);border-radius:99px;padding:5px 18px;font-variant-numeric:tabular-nums}
#hw .st{height:326px;display:grid;place-items:center;position:relative;margin-top:4px}
#hw .st>div{position:relative;z-index:1}
#hw .st .hidro{width:348px;height:271px}
#hw .sh{position:absolute!important;z-index:0!important;bottom:26px;left:50%;width:220px;height:20px;margin-left:-110px;border-radius:50%;background:rgba(0,70,86,.16)}
#hw .ln{font-size:29px;font-weight:700;text-align:center;line-height:1.15;margin-top:8px}
#hw .bar{height:16px;border-radius:99px;background:rgba(0,70,86,.14);margin-top:18px;overflow:hidden}
#hw .bar i{display:block;height:100%;background:var(--petrol);border-radius:99px}
#nx{flex:1;background:#182830;padding:20px 28px;display:flex;align-items:center;gap:20px}
#nx i{width:78px;height:78px;border-radius:22px;background:var(--blue);display:grid;place-items:center;flex-shrink:0}
#nx i svg{width:46px}
#nx b{font-size:27px;font-weight:700;display:block;line-height:1.15}
#nx span{font-size:22px;color:#9FB9C2}
.toast{position:absolute;left:50%;top:22px;transform:translate(-50%,-180%);background:#fff;color:var(--petrol);border-radius:99px;padding:15px 34px 15px 20px;font-size:28px;font-weight:700;white-space:nowrap;display:flex;gap:16px;align-items:center;z-index:9;transition:transform .45s cubic-bezier(.2,1.2,.3,1)}
.toast.on{transform:translate(-50%,0)}
.map .toast svg{position:static;width:44px;height:44px;flex-shrink:0}
.spark{position:absolute;width:20px;height:20px;border-radius:50%;pointer-events:none;z-index:20;animation:spk 1s cubic-bezier(.1,.7,.3,1) forwards}
@keyframes spk{to{transform:translate(var(--dx),var(--dy)) scale(.2);opacity:0}}
.pulse{animation:pl 1.4s ease-out infinite;transform-box:fill-box;transform-origin:center}
@keyframes pl{from{transform:scale(.5);opacity:.9}to{transform:scale(2.2);opacity:0}}
</style>
</head>
<body>
<div id="fit">
  <svg class="dash" viewBox="0 0 1920 1080">
    <path d="M0 190 H1920 V230 Q960 160 0 230Z" fill="#26343A"/>
    <path d="M0 1080 V720 Q220 640 420 900 L1520 900 Q1720 640 1920 720 V1080Z" fill="#0C1418"/>
    <g fill="#1F2C32"><rect x="1716" y="420" width="150" height="118" rx="26"/><rect x="54" y="420" width="150" height="118" rx="26"/></g>
    <g stroke="#0C1418" stroke-width="9"><path d="M1732 450h118M1732 479h118M1732 508h118M70 450h118M70 479h118M70 508h118"/></g>
    <path d="M-150 1180 a330 330 0 0 1 660 0" fill="none" stroke="#050A0C" stroke-width="74"/><path d="M-150 1180 a330 330 0 0 1 660 0" fill="none" stroke="#28363C" stroke-width="54"/><path d="M60 1080 q120 -84 240 0z" fill="#28363C"/>
    <rect x="820" y="930" width="280" height="30" rx="15" fill="#28363C"/>
  </svg>
  <div class="disp"><div class="ui">
    <div class="dock"><b>18:42</b>
      <i style="background:#2C8C5A"><svg viewBox="0 0 24 24" fill="none" stroke="#fff" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 21s6.5-6 6.5-11a6.5 6.5 0 0 0-13 0c0 5 6.5 11 6.5 11z"/><circle cx="12" cy="10" r="2.4"/></svg></i>
      <i style="background:#A63D57"><svg viewBox="0 0 24 24" fill="none" stroke="#fff" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M9 18V6l10-2v12"/><circle cx="6.8" cy="18" r="2.3"/><circle cx="16.8" cy="16" r="2.3"/></svg></i>
      <i style="background:#0478B2"><svg viewBox="0 0 121 95" fill="#fff" id="mk"></svg></i>
      <i style="background:#39474D"><svg viewBox="0 0 24 24" fill="none" stroke="#fff" stroke-width="2" stroke-linecap="round"><path d="M5 8h14M5 12h14M5 16h14"/></svg></i>
    </div>
    <div class="map">
      <svg viewBox="0 0 790 748" preserveAspectRatio="xMidYMid slice">
        <g stroke="#22353D" stroke-width="26" fill="none" stroke-linecap="round"><path d="M-20 120 H820M-20 330 H820M-20 560 H820M120 -20 V770M360 -20 V770M610 -20 V770"/></g>
        <g stroke="#2B434C" stroke-width="10" fill="none"><path d="M-20 225 H820M-20 440 H820M-20 660 H820M240 -20 V770M490 -20 V770M710 -20 V770"/></g>
        <path d="M-20 690 Q260 640 420 470 T820 60" stroke="#35525D" stroke-width="44" fill="none"/>
        <rect x="395" y="585" width="190" height="60" rx="12" fill="#1D4A3A"/><rect x="630" y="350" width="64" height="170" rx="12" fill="#1D4A3A"/>
        <path id="route" d="M120 700 V560 H360 V330 H610 V196" stroke="#4BB3E7" stroke-width="16" fill="none" stroke-linecap="round" stroke-linejoin="round"/>
        <g id="pin" transform="translate(610 150)"><circle class="pulse" r="34" fill="none" stroke="#E0FF48" stroke-width="7"/><circle r="42" fill="#0478B2" stroke="#fff" stroke-width="6"/><g transform="translate(-27 -21) scale(.45)" fill="#fff" id="mk2"></g></g>
        <g id="carI"><circle r="27" fill="#fff"/><path d="M0 -15 L12 13 L0 6 L-12 13Z" fill="#0478B2"/></g>
      </svg>
      <div class="eta" id="eta">Campo de las Naciones<span>On your route home</span></div>
      <div class="toast" id="toast"><svg viewBox="0 0 48 48"><circle cx="24" cy="24" r="21" fill="#90FFBB"/><path d="M14 25l7 7 14-15" fill="none" stroke="#004656" stroke-width="5" stroke-linecap="round" stroke-linejoin="round"/></svg>Charge paid · +80</div>
    </div>
    <div class="col">
      <div class="w" id="hw"><div class="hd"><span>Hidro</span><span class="wk" id="wk">Today</span></div>
        <div class="st"><div class="sh"></div><div id="hh"></div></div>
        <div class="ln" id="ln">Shining</div><div class="bar"><i id="bar"></i></div></div>
      <div class="w" id="nx"><i><svg viewBox="0 0 24 24" fill="#E0FF48"><path d="M13.5 2L5 13.5h5.5L9.5 22 19 9.5h-6z"/></svg></i><div><b>Fast charger free</b><span>800 m ahead, 150 kW</span></div></div>
    </div>
  </div></div>
</div>
<script src="js/hidro.js"></script>
<script src="js/data.js"></script>
<script src="js/plaza.js"></script>
<script>
(function () {
  const H = HIDRO, $ = q => document.querySelector(q);
  const fit = () => { const s = Math.min(innerWidth / 1920, innerHeight / 1080); $('#fit').style.transform = `translate(${(innerWidth - 1920 * s) / 2}px,${(innerHeight - 1080 * s) / 2}px) scale(${s})`; };
  addEventListener('resize', fit); fit();
  $('#mk').innerHTML = PLAZA.MARK; $('#mk2').innerHTML = PLAZA.MARK;
  const body = { level: 5, head: 'crown', stars: false };
  const wait = ms => new Promise(r => setTimeout(r, ms));
  const route = $('#route'), L = route.getTotalLength();
  function car(u) {
    const p = route.getPointAtLength(L * u), q = route.getPointAtLength(Math.min(L, L * u + 2)), a = u >= .999 ? 0 : Math.atan2(q.y - p.y, q.x - p.x) * 180 / Math.PI + 90;
    $('#carI').setAttribute('transform', `translate(${p.x} ${p.y}) rotate(${a})`); route.style.strokeDasharray = L; route.style.strokeDashoffset = -L * u;
  }
  function paint(shine, mood) {
    $('#hh').innerHTML = H.svg({ ...body, shine, mood });
    const g = H.clamp((shine - 6) / 74);
    $('#hw').style.background = H.mix('#C2CBCE', '#90FFBB', g);
    $('#hw').style.filter = `brightness(${(.72 + .28 * g).toFixed(3)})`;
    $('#bar').style.width = Math.max(3, shine) + '%';
  }
  const set = (wk, ln) => { if (wk) $('#wk').textContent = wk; if (ln) $('#ln').textContent = ln; };
  function tween(ms, f) { return new Promise(r => H.run(ms, t => f(t * 1000 / ms), r)); }
  function reset() { paint(94, 'happy'); set('Today', 'Shining'); car(0); $('#toast').classList.remove('on'); }
  /* marks: 0 fade starts 1.1 s · arrive 6.4 s · paid 7.6 s (till sound) · Hidro 8.5 s (his sound) */
  async function play({ onPaid, onHidro } = {}) {
    reset(); await wait(1100);
    const weeks = [[1, 78, 'happy', 'Still bright'], [2, 58, 'happy', 'No green move yet'], [3, 36, 'sad', 'Getting pale'], [4, 20, 'sad', 'Fading'], [5, 7, 'sleepy', 'Wake me up']];
    let from = 94;
    for (const [w, to, mood, ln] of weeks) { set('Week ' + w, ln); const f0 = from; await tween(820, u => paint(H.lerp(f0, to, H.easeInOut(u)), mood)); from = to; await wait(120); }
    tween(1500, u => car(.0 + H.easeInOut(u)));
    await wait(1500);
    $('#toast').classList.add('on'); onPaid && onPaid(); await wait(900);
    onHidro && onHidro(); set('Today', 'Back on his feet');
    tween(1500, u => { const g = H.easeInOut(u); $('#hw').style.background = H.mix('#C2CBCE', '#90FFBB', g); $('#hw').style.filter = `brightness(${(.72 + .28 * g).toFixed(3)})`; $('#bar').style.width = H.lerp(7, 94, g) + '%'; });
    setTimeout(() => PLAZA.burst($('#hw'), 223, 230, 250, 24), 2520);
    await H.spin($('#hh'), { dur: 3, turns: 3, after: 'joy', cfg: body, from: 7, to: 94 });
    $('#toast').classList.remove('on'); set('Today', 'Shining'); H.setMood($('#hh'), 'happy'); H.wave($('#hh'), { n: 3, dur: 1.4 });
    await wait(1500);
  }
  reset();
  const q = new URLSearchParams(location.search);
  if (!q.has('film')) addEventListener('click', () => play({ onHidro: H.sound }));
  window.CAR = { play, reset, paint, car };
})();
</script>
</body>
</html>
